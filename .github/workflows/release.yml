# =============================================================================
#  RELEASE — build Linux, Windows, and macOS apps, then publish them together
# =============================================================================
#
#  Every push to `main` builds a Linux AppImage, Windows installer, and unsigned
#  macOS DMGs, then creates a versioned release. Older releases remain available,
#  and the newest is marked latest for update checks.
#
#  ---------------------------------------------------------------------------
#  The four secrets, and what publishing them means
#  ---------------------------------------------------------------------------
#
#  `scripts/desktop-keys.mjs` reads these four from the environment and writes
#  them into `desktop/builtin-keys.json`, which ships inside all platform builds.
#  That file is what makes the app work before anyone has entered a key of their
#  own — the first-run screen offers "or use the built-in keys", and this is
#  where those come from.
#
#  It also means **anyone who downloads a release can read all four keys out of
#  any platform build.** For a public repository that is anyone at all. The
#  translator's key is the one to think about, because it is billed per use.
#  Leave the secrets unset if they should not be distributed; the build still
#  succeeds and the first-run screen asks each viewer for their own keys.
#
#  Set them under Settings → Secrets and variables → Actions → New repository
#  secret, with exactly these names.
#
# =============================================================================

name: Release

on:
  push:
    branches: [main]
  # So a build can be triggered without pushing an empty commit.
  workflow_dispatch:

# `contents: write` is what lets the job create the release and upload the
# asset. It is the only permission this needs.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Not `cancel-in-progress`: a cancelled run can be killed partway through
  # uploading a 134 MB file. Queuing costs a few minutes and keeps release
  # creation ordered.
  cancel-in-progress: false

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `ci` rather than `install` so the lockfile is authoritative and the
        # build fails loudly if it and package.json have drifted apart.
        run: npm ci

      - name: FUSE runtime
        # electron-builder's AppImage tooling links against libfuse2 to build
        # the image. Recent Ubuntu renamed the package. Neither is always
        # needed and neither is worth failing a release over.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Set release version
        run: |
          version="$(node -p "const [major, minor] = require('./package.json').version.split('.'); major + '.' + minor + '.' + process.env.GITHUB_RUN_NUMBER")"
          npm version "$version" --no-git-tag-version

      - name: Build the AppImage
        # The four names have to match `NAMES` in scripts/desktop-keys.mjs.
        # An unset secret expands to an empty string, which the script treats
        # as absent and warns about rather than failing on.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
        run: npm run desktop:pack

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/latest-linux.yml
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: bash
        run: |
          version="$(node -p "const [major, minor] = require('./package.json').version.split('.'); major + '.' + minor + '.' + process.env.GITHUB_RUN_NUMBER")"
          npm version "$version" --no-git-tag-version

      - name: Build Windows installer
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
        run: npm run desktop:pack:win

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            release/Streamly-Setup-*.exe
            release/Streamly-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    name: Build unsigned macOS DMG
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: bash
        run: |
          version="$(node -p "const [major, minor] = require('./package.json').version.split('.'); major + '.' + minor + '.' + process.env.GITHUB_RUN_NUMBER")"
          npm version "$version" --no-git-tag-version

      - name: Generate macOS app icon
        run: |
          mkdir -p desktop/resources/Streamly.iconset
          sips -z 16 16 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 desktop/resources/icon.png --out desktop/resources/Streamly.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns desktop/resources/Streamly.iconset -o desktop/resources/icon.icns

      - name: Build macOS DMG
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
        run: npm run desktop:pack:mac -- --${{ matrix.arch }}

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release-assets
          path: release/Streamly-*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish versioned release
    needs: [appimage, windows, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set release version
        run: |
          version="$(node -p "const [major, minor] = require('./package.json').version.split('.'); major + '.' + minor + '.' + process.env.GITHUB_RUN_NUMBER")"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: release

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release

      - name: Download Intel macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-release-assets
          path: release

      - name: Download Apple Silicon macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release-assets
          path: release

      - name: Verify artifacts and create checksums
        run: |
          set -euo pipefail
          test -f "release/Streamly-${VERSION}.AppImage"
          test -f "release/Streamly-Setup-${VERSION}.exe"
          test -f "release/Streamly-${VERSION}-x64.dmg"
          test -f "release/Streamly-${VERSION}-arm64.dmg"
          test -f release/latest-linux.yml
          test -f release/latest.yml
          ( cd release && sha256sum "Streamly-${VERSION}.AppImage" > "Streamly-${VERSION}.AppImage.sha256" )
          ( cd release && sha256sum "Streamly-Setup-${VERSION}.exe" > "Streamly-Setup-${VERSION}.exe.sha256" )
          ( cd release && sha256sum "Streamly-${VERSION}-x64.dmg" > "Streamly-${VERSION}-x64.dmg.sha256" )
          ( cd release && sha256sum "Streamly-${VERSION}-arm64.dmg" > "Streamly-${VERSION}-arm64.dmg.sha256" )

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          short="${SHA:0:7}"
          subject="$(git log -1 --pretty=%s)"
          notes="$(printf '%s\n\n%s\n%s\n' \
            "$short — $subject" \
            "Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}" \
            "Streamly ${VERSION} for Linux, Windows, and macOS. macOS DMGs are unsigned manual downloads.")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Streamly ${VERSION}" --notes "$notes" --latest
          else
            gh release create "$tag" --target "$SHA" --title "Streamly ${VERSION}" --notes "$notes" --latest
          fi

          gh release upload "$tag" release/* --clobber
